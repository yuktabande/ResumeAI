services:
  - type: web
    name: resume-intelligence
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: python3 -m alembic upgrade head && python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-intelligence-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.0"

databases:
  - name: resume-intelligence-db
    databaseName: resume_intelligence
    plan: free
